// Map configuration - tiles stored with normalized web coordinates
// X: offset by minX (starts at 0)
// Y: flipped (Y=0 at top, increases southward)
var gridMinX = -29;
var gridMaxX = 29;
var gridMinY = -19;
var gridMaxY = 28;
var tileSize = 512;
var cellSize = 256; // Each game cell is always 256px, regardless of output tile size
var mapMinZoom = 0;
var mapMaxZoom = 5;
var mapMinResolution = Math.pow(2, mapMaxZoom);

// Map dimensions in cells
var mapWidthCells = gridMaxX - gridMinX + 1;
var mapHeightCells = gridMaxY - gridMinY + 1;

// Extent in pixels (based on cell size, not tile size)
var mapExtent = [0, 0, mapWidthCells * cellSize, mapHeightCells * cellSize];

// Configure CRS - simple pixel coordinates
// Tiles are stored with Y=0 at top (web-standard), so we need transformation
// that doesn't negate Y (default L.CRS.Simple negates Y)
var crs = L.CRS.Simple;
crs.transformation = new L.Transformation(1, 0, 1, 0);
crs.scale = function(zoom) { return Math.pow(2, zoom) / mapMinResolution; };
crs.zoom = function(scale) { return Math.log(scale * mapMinResolution) / Math.LN2; };

// Create map
var map = new L.Map('map', {
    maxZoom: mapMaxZoom * 2,
    minZoom: mapMinZoom,
    crs: crs,
    attributionControl: false
});

// Marker icon
var mwIcon = L.icon({
    iconUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAAAMCAYAAABWdVznAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAO0lEQVQokWP8//8/AymAhYGBgWHb/ByidHklTmFkIsl4mA1IgBGHOrgLSLZhOGhADyWC8UGyDYykJg0AvqIMFsgeioQAAAAASUVORK5CYII=',
    shadowUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAAAMCAYAAABWdVznAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAGElEQVQokWNkYGD4z0ACYCJF8aiGkaQBAGOyARfDSz7hAAAAAElFTkSuQmCC',
    iconSize: [12, 12],
    shadowSize: [12, 12]
});

// Create marker feature groups
var cellMarkers = L.markerClusterGroup({
    disableClusteringAtZoom: 5,
    maxClusterRadius: 50,
    spiderfyOnMaxZoom: false,
    showCoverageOnHover: false,
    iconCreateFunction: function (cluster) {
        var labels = getClusterLabels(cluster);
        var clusterLabels = labels.join('<br/>');
        cluster.bindTooltip(clusterLabels);
        return mwIcon;
    }
});
var doorMarkers = L.markerClusterGroup({
    disableClusteringAtZoom: 8,
    maxClusterRadius: 40,
    spiderfyOnMaxZoom: false,
    showCoverageOnHover: false,
    iconCreateFunction: function (cluster) {
        var labels = getClusterLabels(cluster);
        var clusterLabels = labels.join('<br/>');
        cluster.bindTooltip(clusterLabels);
        return mwIcon;
    }
});

function getClusterLabels(cluster) {
    var directLabels = [];
    if (cluster._markers != null) {
        directLabels = cluster._markers.map(m => m._tooltip._content.split(',')[0]);
    }
    for (var child in cluster._childClusters) {
        console.log(child)
        directLabels = directLabels.concat(getClusterLabels(cluster._childClusters[child]));
    }
    return directLabels.filter((value, index, array) => array.indexOf(value) === index);;
}

// Helper to convert game coordinates to normalized pixel coordinates
// Game coords: X increases east, Y increases north
// Normalized: X offset by minX, Y flipped (north at top)
// Uses cellSize (256px) not tileSize, since each game cell is always 256px
function gameToPixel(gameX, gameY) {
    var normX = (gameX - gridMinX) * cellSize;
    var normY = (gridMaxY + 1 - gameY) * cellSize;
    return [normY, normX]; // Leaflet uses [lat, lng] = [y, x]
}

// Add cell markers (convert from game grid to normalized pixel coordinates)
// Add 0.5 to center marker within the cell
if (mapCells != null) {
    for (var ix in mapCells) {
        var pos = gameToPixel(mapCells[ix].gridX + 0.5, mapCells[ix].gridY + 0.5);
        L.marker(pos, {icon: mwIcon})
            .addTo(cellMarkers)
            .bindTooltip(mapCells[ix].name);
    }
}

// Add door markers (convert from game grid with sub-cell precision)
if (mapDoors != null) {
    for (var ix in mapDoors) {
        var pos = gameToPixel(mapDoors[ix].gridX, mapDoors[ix].gridY);
        L.marker(pos, {icon: mwIcon})
            .addTo(doorMarkers)
            .bindTooltip(mapDoors[ix].destination);
    }
}

// Fast Travel layer
var travelLayer = L.layerGroup();

// Travel type colors
var travelColors = {
    'SiltStrider': '#8B4513',
    'Boat': '#4169E1',
    'Gondola': '#20B2AA',
    'MagesGuild': '#9932CC',
    'Propylon': '#FFD700',
    'Unknown': '#808080'
};

// Travel type display labels
var travelLabels = {
    'SiltStrider': 'Caravaner',
    'Boat': 'Shipmaster',
    'Gondola': 'Gondolier',
    'MagesGuild': 'Guild Guide',
    'Propylon': 'Propylon Index',
    'Unknown': 'Other'
};

// Create fast travel network if data exists
if (travelData != null) {
    // Draw routes first (so nodes appear on top)
    if (travelData.routes != null) {
        for (var ix in travelData.routes) {
            var route = travelData.routes[ix];
            var fromPos = gameToPixel(route.fromGridX, route.fromGridY);
            var toPos = gameToPixel(route.toGridX, route.toGridY);
            var color = travelColors[route.type] || travelColors['Unknown'];

            L.polyline([fromPos, toPos], {
                color: color,
                weight: 2,
                opacity: 0.7,
                dashArray: '5, 5'
            }).addTo(travelLayer);
        }
    }

    // Draw nodes (travel service locations)
    if (travelData.nodes != null) {
        for (var ix in travelData.nodes) {
            var node = travelData.nodes[ix];
            var pos = gameToPixel(node.gridX, node.gridY);
            var color = travelColors[node.type] || travelColors['Unknown'];
            var label = travelLabels[node.type] || travelLabels['Unknown'];

            L.circleMarker(pos, {
                radius: 6,
                fillColor: color,
                color: '#000',
                weight: 1,
                opacity: 1,
                fillOpacity: 0.8
            }).addTo(travelLayer)
              .bindTooltip(node.npcName + ' (' + label + ')');
        }
    }
}

// Define base layers
var baseLayers = {

    "Generated Map": L.tileLayer('tiles/base/{z}/{x}/{y}.webp', {
        minZoom: mapMinZoom,
        maxNativeZoom: mapMaxZoom,
        maxZoom: mapMaxZoom * 2,
        noWrap: true,
        tileSize: tileSize
    }),

};

// Define overlay layers
var overlayLayers = {

    "Cells": cellMarkers,
    "Doors": doorMarkers,
    "Fast Travel": travelLayer
};

// Add the default base layer to the map
baseLayers["Generated Map"].addTo(map);
overlayLayers["Cells"].addTo(map);

// Add layer control
L.control.layers(baseLayers, overlayLayers).addTo(map);

// Fit bounds - use normalized pixel coordinates
// mapExtent = [0, 0, width, height] in pixels
map.fitBounds([
    [0, 0],
    [mapExtent[3], mapExtent[2]]
]);
